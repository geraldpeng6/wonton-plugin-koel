# Koel 音乐流媒体：用户的音乐放在共享文件夹 music 里，经核心网关访问，登录用 Koel 自带的
# 邮箱账号（免费版的 SSO 和反代头认证都是 Koel Plus 的付费功能，见 plugin-spec 的"应用自带的登录"）。
# 数据库用上游推荐的独立 PostgreSQL 容器（koel/docker：不含数据库，需要单独的 MariaDB/MySQL 或 PostgreSQL）。
name: koel

services:
  db:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    # Alpine 官方镜像的 postgres 用户是 70:70，核心按此准备数据库目录属主。
    user: "70:70"
    read_only: true
    tmpfs: ["/tmp", "/var/run/postgresql"]
    environment:
      POSTGRES_USER: koel
      POSTGRES_PASSWORD: ${WONTON_SECRET_DB_PASSWORD:?核心没有注入数据库密码}
      POSTGRES_DB: koel
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA:?核心没有注入插件数据目录}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "koel", "-d", "koel"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

  koel:
    image: phanan/koel:9.15.0@sha256:af1ec7daf06d22f6781d9e79716e52048108c21b05adfebccec2e474a29f6fde
    depends_on:
      db:
        condition: service_healthy
    # 上游镜像以 Apache + PHP（www-data）运行；entrypoint 覆盖后镜像 CMD 会被清掉，显式写回。
    entrypoint: ["/bin/sh", "/wonton-start.sh"]
    command: ["apache2-foreground"]
    volumes:
      - ${WONTON_SHARE_MUSIC:?核心没有授权 music 共享文件夹}:/music:ro
      - ${WONTON_APP_DATA}/images:/var/www/html/storage/app/public/images
      - ${WONTON_APP_DATA}/search-indexes:/var/www/html/storage/search-indexes
      - ${WONTON_APP_DATA}/artifacts:/artifacts
    configs:
      - source: start
        target: /wonton-start.sh
    healthcheck:
      # 首页要过 PHP 和数据库，比镜像自带的静态文件检查更真实。
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      start_interval: 2s

configs:
  start:
    content: |
      # 挂载目录由核心按 PUID:PGID 预建，PHP 以镜像内置的 www-data（uid 33）运行，属主对不上。
      # 每次启动把挂载目录本身的属主改回 www-data：幂等，目录里的文件一直是 www-data 写的。
      chown www-data:www-data /artifacts \
        /var/www/html/storage/app/public/images \
        /var/www/html/storage/search-indexes
      # 上游 9.15.0 的 koel-init 只认 /var/www/html/.env（不认环境变量），这里每次启动
      # 用注入的变量生成它；APP_KEY 跨升级是同一把，重跑内容不变，幂等。
      # 写好 .env 后，原 entrypoint 里的 koel:init --no-interaction 会跑迁移、种默认管理员
      # （admin@koel.dev / KoelIsCool，上游写死，无配置项可改）并把 MEDIA_PATH 写进应用设置，全部幂等。
      cat > /var/www/html/.env <<WONTONENV
      APP_KEY=base64:${WONTON_SECRET_APP_KEY:?核心没有注入应用密钥}
      APP_URL=${WONTON_APP_URL:?核心没有注入插件网页地址}
      DB_CONNECTION=pgsql
      DB_HOST=db
      DB_PORT=5432
      DB_DATABASE=koel
      DB_USERNAME=koel
      DB_PASSWORD=${WONTON_SECRET_DB_PASSWORD:?核心没有注入数据库密码}
      MEDIA_PATH=/music
      ARTIFACTS_PATH=/artifacts
      # 不申请 network.egress，需要外网的集成显式关掉：MusicBrainz 元数据、播客订阅、
      # 网络电台在只有内网的环境里会一直重试、报错。Last.fm、Spotify、YouTube 没配密钥本来就是关的。
      USE_MUSICBRAINZ=false
      PODCASTS_ENABLED=false
      RADIO_ENABLED=false
      WONTONENV
      exec /usr/local/bin/koel-entrypoint "$$@"

x-wonton:
  spec: "0.6"
  id: dev.koel.koel
  version: 0.1.0
  kind: app
  title: { en: Koel }
  description:
    zh: 把共享文件夹里的音乐变成你自己的流媒体音乐库
    en: Turn the music in your shared folder into your own streaming library
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png, screenshots/album.png, screenshots/player.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://koel.dev
  # 应用（Koel）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: MIT
  tags:
    zh: [音乐]
    en: [Music]
  about:
    zh: |
      把共享文件夹里的音乐整理成自己的流媒体音乐库：按歌手、专辑浏览，建歌单，看收听统计。网页在手机上也好用。

      第一次打开用默认管理员登录：admin@koel.dev / KoelIsCool。登录后请立即在设置里改密码；网关挡在前面，改密码之前只有你打得开登录页。

      音乐目录只读：把歌曲放进 music 共享文件夹，然后在 Koel 的设置里点扫描。网页上传需要可写的媒体目录，这里用不了。

      播客、网络电台、Last.fm、MusicBrainz 元数据这些要连外网的功能默认关闭；插件不申请出网权限。单点登录（Google / OIDC）和反向代理认证是 Koel Plus 的付费功能，免费版用不了。
    en: |
      Turn the music in your shared folder into your own streaming library: browse by artist and album, build playlists, and see listening statistics. The web app works well on phones.

      The first sign-in uses the default admin account: admin@koel.dev / KoelIsCool. Change the password right away in Settings; the gateway sits in front, so before the change only you can reach the login page.

      The music folder is read-only: drop songs into the music shared folder, then press Scan in Koel's settings. Uploading from the web needs a writable media folder and does not work here.

      Podcasts, internet radio, Last.fm and MusicBrainz metadata need the internet and are turned off; the plugin does not ask for outbound access. Single sign-on (Google / OIDC) and reverse-proxy authentication are paid Koel Plus features and are not available in the free edition.
  release_notes: { zh: 第一版。, en: First release. }
  webui:
    service: koel
    port: 80
    sso: none
  permissions:
    - storage.share.music:read
  secrets:
    db_password:
      generate: { bytes: 32 }
    # 32 字节 base64，前面拼上 base64: 就是 Laravel 的 APP_KEY 格式。
    app_key:
      generate: { bytes: 32, encoding: base64 }
  requirements:
    arch: [amd64, arm64]
    memory: 512M
