name: 检查

on:
  pull_request:
  push:
    branches: [main]
  # 手动入口：想合并前跑一遍冒烟时，从这里触发（冒烟作业只在 Dependabot 的 PR 和手动触发时跑）。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: geraldpeng6/wonton-plugin-template/.github/workflows/plugin-check.yml@dc5b59f02b09c3740b4df66ae1d0a506e27f08c7
